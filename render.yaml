# One-click setup on Render (render.com): New > Blueprint, then pick this repository.
# Render asks for the values marked sync: false.
databases:
  - name: kademe-db
    plan: basic-256mb
    databaseName: kademe
    user: kademe
services:
  - type: web
    name: kademe-portal
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # The internal connection string Render provides does not use TLS.
      - key: DATABASE_SSL
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kademe-db
          property: connectionString
      - key: ORG_NAME
        value: Kademe
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD # temporary, at least 8 characters
        sync: false
      - key: ADMIN_NAME
        sync: false
